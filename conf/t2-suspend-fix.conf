# /etc/t2-suspend-fix.conf - settings for the t2-suspend-fix sleep hook.
# Changes apply from the next suspend, no restart needed.
# Run "t2-suspend-diag" to see what is detected on this Mac.

# Unload the Broadcom Wi-Fi and Bluetooth drivers before sleeping and reload
# them after waking up. Prevents aborted suspends that freeze the T2.
# yes | no
RELOAD_WIFI_BT=yes

# Remove the Thunderbolt PCI branch before sleeping when nothing is plugged
# into the USB-C ports, and rescan it right after: wake-up goes from ~12 s
# to ~2 s. With a USB-C device or external display connected it is skipped.
# auto | no
FAST_THUNDERBOLT_RESUME=auto

# Keep the Touch Bar dark on wake-up until tiny-dfr is ready, instead of
# flashing the default layout. Only used when tiny-dfr is running.
# auto | no
TOUCHBAR_FIX=auto

# Restore the keyboard backlight level after waking up.
# yes | no
RESTORE_KBD_BACKLIGHT=yes

# User services to restart after waking up, if running (space separated).
# wluma loses its backlight/sensor handles on resume.
RESTART_USER_SERVICES="wluma.service"

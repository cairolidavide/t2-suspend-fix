# /etc/t2-suspend-fix.conf - settings for the t2-suspend-fix sleep hook.
# Changes apply from the next suspend, no restart needed.
# Run "t2-suspend-diag" to see what is detected on this Mac.

# Unload the Broadcom Wi-Fi and Bluetooth drivers before sleeping and reload
# them after waking up. Prevents aborted suspends that freeze the T2.
# yes | no
RELOAD_WIFI_BT=yes

# Remove the Thunderbolt PCI branch before sleeping when nothing is plugged
# into the USB-C ports, and rescan it right after: wake-up goes from ~12 s
# to ~2 s. With a USB-C device or external display connected it is skipped.
# auto | no
FAST_THUNDERBOLT_RESUME=auto

# Keep the Touch Bar dark on wake-up until tiny-dfr is ready, instead of
# flashing the default layout. Only used when tiny-dfr is running.
# auto | no
TOUCHBAR_FIX=auto

# Restore the keyboard backlight level after waking up.
# yes | no
RESTORE_KBD_BACKLIGHT=yes

# User services to restart after waking up, if running (space separated).
# Empty by default: wluma 5 re-discovers the keyboard and screen backlights
# by itself within ~2 s, while restarting it can make it crash for ~30 s
# when the ambient light sensor is not ready yet. Only add services that do
# not recover by themselves.
RESTART_USER_SERVICES=""

# EXPERIMENTAL. If the T2 stops answering during a suspend (keyboard,
# trackpad, Touch Bar and audio dead), unbind its driver and probe it again,
# up to T2_RECOVERY_ATTEMPTS times. With the t2bce driver this crashes the
# kernel (oops): keep it off unless your T2 driver handles unbinding.
# yes | no
T2_RECOVERY=no
T2_RECOVERY_ATTEMPTS=2

# With the lid closed, power off instead of letting logind retry the suspend
# in a loop (Mac awake and hot in a bag) when the T2 cannot be revived or
# FAILSAFE_MAX_FAILURES suspends in a row have failed.
# yes | no
FAILSAFE_POWEROFF=yes
FAILSAFE_MAX_FAILURES=3

# Installed by t2-suspend-fix.
# Keep the t2bce T2 drivers out of the initramfs, so they load after
# switch-root like on a system without this file in modules-load.d.
# When dracut copies /etc/modules-load.d/ into the initramfs, the T2 drivers
# load before the root filesystem: t2bce_audio fails ("Failed to start Load
# Kernel Modules") and the Mac no longer wakes up from suspend.
# Not installed when the disk is encrypted: the internal keyboard is needed
# in the initramfs to type the passphrase.
omit_drivers+=" t2bce_core t2bce_dma t2bce_vhci t2bce_audio "
omit_dracutmodules+=" systemd-modules-load "

# Installed by t2-suspend-fix.
# Use S3 (deep) only: falling back to s2idle when a suspend fails doubles the
# failed attempts, and repeated aborted suspends make the T2 time out.
# MemorySleepMode alone is not enough: the default SuspendState also lists
# "freeze", which is s2idle whatever mem_sleep says.
[Sleep]
SuspendState=mem
MemorySleepMode=deep
